<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>ICT Seatwork</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
             text-align: center;
             background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQMbEJgoiUkoBHq8aWf8snJzfa-nlaR32u4jiSkeL5XyQ&s=10');
             background-size: cover;
             }
        h1 { color: rgb(176, 209, 9); }
        #output1 {border-radius: 10px; font-size: 40px; padding: 20px; font-weight: bolder;}
        #output2 { border: 5px solid rgb(199, 220, 11); box-shadow: 0px 5px 5px rgb(200, 200, 200); min-height: 500px; border-radius: 10px; font-size: 20px; padding: 20px; }
        .SirCachero {
            background-color: rgb(164, 199, 104);
            opacity: 75%;
        }
        .formity {
            opacity: 300%;
        }
    </style>
</head>
<body>
    <br>
    <h1>Kalimbayan Land</h1>
    <h3>Enter your First and Last name to check your status in Kalimbayan Land</h3>
    
    <br><br><div class="SirCachero" id="output2">
        <form action="" class="formity">
        <label for="FirstName">First Name</label>
        <input id="FirstName" class="" placeholder="" required>
        <label for="LastName">Last Name</label>
        <input id="Lastname" class="" placeholder="" >
        <br><br>
        <button type="button" py-click="CheckNum" class="">Status check</button>
        <br>
        </form>
        <br>
        
        
    <div id="output1"></div>
         
    </div>
    <img src="https://media.tenor.com/dIaP-9Yp9fIAAAAM/super-idol.gif" style="width: 100%;height:120px;">
    
    <script type="py" src="main.py"></script>
</body>
</html>
